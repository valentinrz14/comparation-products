<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Precios · Supermercados AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg:       #080C16;
      --surf-1:   #0D1220;
      --surf-2:   #111928;
      --surf-3:   #18243A;
      --border:   rgba(255,255,255,0.06);
      --border-m: rgba(255,255,255,0.11);

      --primary:      #4B8CF5;
      --primary-dim:  rgba(75,140,245,0.15);

      --dia:       #EF6363;
      --carrefour: #4B8CF5;
      --jumbo:     #3FD17A;
      --disco:     #F58642;
      --coto:      #B76EE8;
      --nini:      #F5CC42;
      --promo:     #FF7EB6;

      --green:     #34D399;
      --green-bg:  rgba(52,211,153,0.07);
      --green-dim: rgba(52,211,153,0.18);

      --text:     #DDE5F4;
      --text-sub: #7A8FA8;
      --text-dim: #3D4F65;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOP BAR ── */
    .top-bar {
      background: rgba(13,18,32,0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
    }
    .top-bar-left { display: flex; align-items: center; gap: 10px; }
    .top-bar-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary-dim);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .top-bar-icon .material-icons-round { font-size: 20px; color: var(--primary); }
    .top-bar h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -.2px; }
    .top-bar-meta { font-size: 11px; color: var(--text-sub); }
    .icon-btn {
      background: var(--surf-2); border: 1px solid var(--border-m);
      color: var(--text-sub); border-radius: 9px;
      width: 34px; height: 34px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--surf-3); color: var(--text); }
    .icon-btn .material-icons-round { font-size: 18px; }

    /* ── SUMMARY ── */
    .summary-banner {
      background: var(--surf-1);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
    }
    .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .stat-card {
      background: var(--surf-2);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 16px; min-width: 120px;
    }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-label { font-size: 10px; color: var(--text-sub); margin-top: 3px; text-transform: uppercase; letter-spacing: .6px; }

    .super-legend { display: flex; gap: 5px; flex-wrap: wrap; }
    .super-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; border: 1px solid;
    }
    .super-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .chip-dia       { color: var(--dia);       border-color: rgba(239,99,99,.3);   background: rgba(239,99,99,.07); }
    .chip-dia .dot  { background: var(--dia); }
    .chip-carrefour { color: var(--carrefour); border-color: rgba(75,140,245,.3);  background: rgba(75,140,245,.07); }
    .chip-carrefour .dot { background: var(--carrefour); }
    .chip-jumbo     { color: var(--jumbo);     border-color: rgba(63,209,122,.3);  background: rgba(63,209,122,.07); }
    .chip-jumbo .dot { background: var(--jumbo); }
    .chip-disco     { color: var(--disco);     border-color: rgba(245,134,66,.3);  background: rgba(245,134,66,.07); }
    .chip-disco .dot { background: var(--disco); }
    .chip-coto      { color: var(--coto);      border-color: rgba(183,110,232,.3); background: rgba(183,110,232,.07); }
    .chip-coto .dot { background: var(--coto); }
    .chip-nini      { color: var(--nini);      border-color: rgba(245,204,66,.3);  background: rgba(245,204,66,.07); }
    .chip-nini .dot { background: var(--nini); }
    .chip-nini      { color: var(--nini);      border-color: rgba(245,204,66,.3);  background: rgba(245,204,66,.07); }
    .chip-nini .dot { background: var(--nini); }

    /* ── CONTROLS ── */
    .controls {
      background: var(--surf-1);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      position: sticky; top: 58px; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
    }
    .controls-top { display: flex; gap: 8px; align-items: center; }
    .search-wrap {
      display: flex; align-items: center; gap: 7px;
      background: var(--surf-2); border: 1px solid var(--border-m);
      border-radius: 9px; padding: 7px 12px;
      flex: 1; max-width: 360px; transition: border-color .15s;
    }
    .search-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
    .search-wrap .material-icons-round { color: var(--text-dim); font-size: 17px; }
    .search-wrap input {
      border: none; background: transparent; outline: none;
      font-size: 13px; font-family: 'Rubik', sans-serif;
      color: var(--text); width: 100%;
    }
    .search-wrap input::placeholder { color: var(--text-sub); }
    .sort-select {
      padding: 7px 11px; border: 1px solid var(--border-m); border-radius: 9px;
      font-family: 'Rubik', sans-serif; font-size: 12px;
      outline: none; cursor: pointer;
      background: var(--surf-2); color: var(--text);
    }

    .cat-tabs {
      display: flex; gap: 4px; overflow-x: auto; padding-bottom: 1px;
      scrollbar-width: thin; scrollbar-color: var(--surf-3) transparent;
    }
    .cat-tabs::-webkit-scrollbar { height: 3px; }
    .cat-tabs::-webkit-scrollbar-thumb { background: var(--surf-3); border-radius: 3px; }
    .cat-tab {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent; cursor: pointer;
      font-size: 11px; font-weight: 500; font-family: 'Rubik', sans-serif;
      white-space: nowrap; transition: all .15s;
      color: var(--text-sub);
      display: flex; align-items: center; gap: 4px;
    }
    .cat-tab:hover  { border-color: var(--border-m); color: var(--text); background: var(--surf-2); }
    .cat-tab.active { background: var(--primary-dim); color: var(--primary); border-color: rgba(75,140,245,.4); }

    /* ── MAIN ── */
    .main { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }

    .cat-section { margin-bottom: 36px; }
    .cat-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .cat-title .emoji { font-size: 18px; }
    .cat-title h2 { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -.1px; }
    .cat-badge {
      background: var(--surf-2); color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 8px;
      font-size: 10px; font-weight: 500;
    }
    .cat-title::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, var(--border-m), transparent);
    }

    /* ── PRODUCT GRID ── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 10px;
      align-items: start;
    }

    /* ── PRODUCT CARD ── */
    .product-card {
      background: var(--surf-1);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color .18s, box-shadow .18s, transform .12s;
    }
    .product-card:hover {
      border-color: var(--border-m);
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      transform: translateY(-1px);
    }

    /* ── CARD HEADER ── */
    .card-header {
      padding: 9px 13px;
      display: flex; align-items: center; flex-wrap: wrap;
      justify-content: space-between; gap: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surf-2);
    }
    .card-product-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      text-transform: capitalize; flex: 1 1 140px; min-width: 0;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .badge {
      display: flex; align-items: center; gap: 3px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }
    .badge-green  { background: var(--green-dim); color: var(--green); }
    .badge-orange { background: rgba(245,134,66,.12); color: var(--disco); }
    .badge .material-icons-round { font-size: 11px !important; }

    /* ── PRICE ROW: supermercados disponibles ── */
    .price-row {
      display: grid;
      grid-template-columns: 76px 78px 1fr;
      align-items: center;
      padding: 5px 13px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      cursor: default;
    }
    .price-row:last-child { border-bottom: none; }
    .price-row:hover { background: var(--surf-2); }

    /* fila más barata */
    .price-row.cheapest {
      background: var(--green-bg);
      border-left: 3px solid var(--green);
      padding-left: 10px;
    }
    .price-row.cheapest:hover { background: rgba(52,211,153,0.1); }

    /* fila sin precio: mucho más compacta y apagada */
    .price-row.unavailable {
      padding-top: 2px; padding-bottom: 2px;
      opacity: .25;
    }
    .price-row.unavailable:hover { background: transparent; opacity: .35; }

    .pr-super {
      font-size: 10px; font-weight: 700;
      letter-spacing: .7px; text-transform: uppercase;
    }
    .pr-super.dia       { color: var(--dia); }
    .pr-super.carrefour { color: var(--carrefour); }
    .pr-super.jumbo     { color: var(--jumbo); }
    .pr-super.disco     { color: var(--disco); }
    .pr-super.coto      { color: var(--coto); }
    .pr-super.nini      { color: var(--nini); }

    .pr-price {
      font-size: 14px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .price-row.cheapest .pr-price { color: var(--green); }
    .pr-price .material-icons-round { font-size: 13px; color: var(--green); }

    .pr-unavailable {
      font-size: 12px; color: var(--text-dim); font-weight: 400;
      grid-column: 2 / -1;
    }

    /* nombre del producto */
    .pr-name { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; overflow: hidden; }
    .pr-name-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1 1 0; min-width: 70px; }
    .pr-size-warn { color: var(--disco); font-size: 10px; font-weight: 700; flex-shrink: 0; white-space: nowrap; }
    .pr-per100 { color: var(--text-dim); font-size: 10px; flex-shrink: 0; white-space: nowrap; }
    .price-row.cheapest .pr-name-text { color: rgba(52,211,153,0.6); }
    .price-row.cheapest .pr-per100 { color: rgba(52,211,153,0.5); }

    /* ── MATCH / PROMOS ── */
    .badge-amber  { background: rgba(245,204,66,.12); color: var(--nini); }
    .badge-gray   { background: rgba(122,143,168,.12); color: var(--text-sub); }
    .badge-promo  { background: rgba(255,126,182,.12); color: var(--promo); }
    .card-badges  { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .pr-tag {
      font-size: 9px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
      padding: 1px 5px; border-radius: 4px; flex-shrink: 0; white-space: nowrap;
    }
    .pr-tag.aprox { background: rgba(245,204,66,.12); color: var(--nini); }
    .pr-tag.libre { background: rgba(122,143,168,.12); color: var(--text-sub); }
    .promo-chip {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
      background: rgba(255,126,182,.14); color: var(--promo); flex-shrink: 0; white-space: nowrap;
    }
    .promo-chip.pay  { background: rgba(122,143,168,.10); color: var(--text-sub); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; cursor: help; }
    .promo-chip.pay .material-icons-round { font-size: 11px; }
    .promo-chip.camp { background: rgba(122,143,168,.10); color: var(--text-sub); font-weight: 500; font-style: italic; max-width: 120px; overflow: hidden; text-overflow: ellipsis; cursor: help; }
    .pr-eff { font-size: 10px; color: var(--promo); font-weight: 600; flex-shrink: 0; white-space: nowrap; }
    .price-row.distinto { opacity: .45; }
    .price-row.distinto:hover { opacity: .7; }
    .price-row.distinto .pr-price { color: var(--text-sub); font-weight: 500; text-decoration: line-through; text-decoration-color: rgba(122,143,168,.5); }
    .toggle-btn {
      display: flex; align-items: center; gap: 5px;
      background: var(--surf-2); border: 1px solid var(--border-m); color: var(--text-sub);
      border-radius: 8px; padding: 0 12px; height: 38px; font-family: inherit; font-size: 13px; cursor: pointer;
      white-space: nowrap;
    }
    .toggle-btn .material-icons-round { font-size: 16px; }
    .toggle-btn.active { border-color: var(--promo); color: var(--promo); background: rgba(255,126,182,.10); }
    .best-buys-item-promo { font-size: 9px; color: var(--promo); font-weight: 700; margin-left: 4px; }

    /* ── NO RESULTS ── */
    .no-results-msg {
      padding: 12px 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-dim);
    }
    .no-results-msg .material-icons-round { font-size: 16px; }

    /* ── LOADING / EMPTY ── */
    .center-msg {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px; gap: 16px; color: var(--text-sub);
      font-size: 14px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--surf-3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      * { transition: none !important; }
    }

    /* ── BEST BUYS ── */
    .best-buys-section {
      background: var(--surf-1);
      border-bottom: 1px solid var(--border);
    }
    .best-buys-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 24px; cursor: pointer; user-select: none;
      transition: background .15s;
    }
    .best-buys-header:hover { background: var(--surf-2); }
    .best-buys-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .best-buys-subtitle { font-size: 11px; color: var(--text-sub); margin-left: auto; margin-right: 4px; }
    .best-buys-panel { overflow-x: auto; }
    .best-buys-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      min-width: 640px;
    }
    .best-buys-col { background: var(--surf-1); padding: 12px 13px 14px; }
    .best-buys-col-title {
      font-size: 10px; font-weight: 700; letter-spacing: .7px;
      text-transform: uppercase; margin-bottom: 9px;
      display: flex; align-items: center; gap: 5px;
    }
    .best-buys-col-title .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .best-buys-item {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 0; border-bottom: 1px solid var(--border); gap: 6px;
    }
    .best-buys-item:last-child { border-bottom: none; }
    .best-buys-item-name { font-size: 11px; color: var(--text-sub); text-transform: capitalize; line-height: 1.3; flex: 1; }
    .best-buys-item-price { font-size: 11px; font-weight: 700; color: var(--green); white-space: nowrap; flex-shrink: 0; }

    @media (max-width: 700px) {
      .product-grid { grid-template-columns: 1fr; }
      .main { padding: 12px; }
      .controls { padding: 8px 12px; }
      .summary-banner { padding: 10px 12px; }
      .best-buys-header { padding: 9px 12px; }
      .top-bar { padding: 0 12px; }
      .price-row { grid-template-columns: 64px 70px 1fr; padding: 5px 10px; }
      .price-row.cheapest { padding-left: 7px; }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-icon">
      <span class="material-icons-round">shopping_cart</span>
    </div>
    <div>
      <h1>Comparador de Precios</h1>
      <div class="top-bar-meta" id="meta-date">Cargando…</div>
    </div>
  </div>
  <button class="icon-btn" title="Recargar datos" onclick="loadData()">
    <span class="material-icons-round">refresh</span>
  </button>
</header>

<div class="summary-banner">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="stat-products">—</div>
      <div class="stat-label">Productos</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-found">—</div>
      <div class="stat-label">Mismo producto (EAN)</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-cheapest-super">—</div>
      <div class="stat-label">Super más económico</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-groups">—</div>
      <div class="stat-label">Con promo</div>
    </div>
  </div>
  <div class="super-legend">
    <div class="super-chip chip-dia"><div class="dot"></div>DIA</div>
    <div class="super-chip chip-carrefour"><div class="dot"></div>Carrefour</div>
    <div class="super-chip chip-jumbo"><div class="dot"></div>Jumbo</div>
    <div class="super-chip chip-disco"><div class="dot"></div>Disco</div>
    <div class="super-chip chip-coto"><div class="dot"></div>Coto</div>
    <div class="super-chip chip-nini"><div class="dot"></div>NINI Mayorista</div>
  </div>
</div>

<div class="controls">
  <div class="controls-top">
    <div class="search-wrap">
      <span class="material-icons-round">search</span>
      <input type="text" id="search-input" placeholder="Buscar producto…" oninput="applyFilters()">
    </div>
    <select class="sort-select" id="sort-select" onchange="applyFilters()">
      <option value="default">Orden original</option>
      <option value="alpha">A → Z</option>
      <option value="cheapest">Más baratos primero</option>
      <option value="promo">Mejor precio con promo</option>
    </select>
    <button class="toggle-btn" id="promo-toggle" onclick="togglePromo()" title="Mostrar solo productos con 2x1, 2do al X% o descuento directo">
      <span class="material-icons-round">local_offer</span> Solo promos
    </button>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
</div>

<div class="best-buys-section">
  <div class="best-buys-header" onclick="toggleBestBuys()">
    <span class="material-icons-round" style="font-size:17px;color:var(--green)">savings</span>
    <span class="best-buys-title">¿Dónde conviene comprar?</span>
    <span class="best-buys-subtitle" id="best-buys-count">—</span>
    <span class="material-icons-round" id="best-buys-icon" style="color:var(--text-sub);font-size:17px">expand_more</span>
  </div>
  <div class="best-buys-panel" id="best-buys-panel" style="display:none">
    <div class="best-buys-grid" id="best-buys-grid"></div>
  </div>
</div>

<main class="main" id="main-content">
  <div class="center-msg">
    <div class="spinner"></div>
    <div>Buscando precios en tiempo real…</div>
  </div>
</main>

<script>
// ── CATEGORIZACIÓN ─────────────────────────────────────────────
const CATS = [
  { name: 'Lácteos',               emoji: '🥛', keys: ['queso','yogurt','leche','mozzarella','manteca','crema','ricotta','serenisima'] },
  { name: 'Huevos',                emoji: '🥚', keys: ['huevo'] },
  { name: 'Frutas',                emoji: '🍎', keys: ['manzana','banana','durazno','frutilla','limon','naranja','pera','uva','anana','melon','sandia','kiwi'] },
  { name: 'Verduras',              emoji: '🥦', keys: ['papa','batata','zanahoria','lechuga','rucula','tomate','cebolla','ajo','brocoli','pepino','zapallo','espinaca','berenjena','choclo','puerro'] },
  { name: 'Cereales y Desayuno',   emoji: '🥣', keys: ['cereal','galleta','miel','te ','te verde','te negro','yerba','azucar','cafe','cacao','granola','avena','tostada'] },
  { name: 'Condimentos',           emoji: '🧴', keys: ['ketchup','mayonesa','salsa','jarabe','vinagre','aceite','mostaza','chimichurri','sal fina','sal gruesa','celusal'] },
  { name: 'Panificación',          emoji: '🌾', keys: ['pan rallado','harina','levadura','bizcocho','galletita'] },
  { name: 'Pastas y Granos',       emoji: '🍝', keys: ['fideo','pasta','arroz','caldo','polenta','lenteja','quinoa','barletta','rapidita'] },
  { name: 'Conservas y Legumbres', emoji: '🥫', keys: ['atun','arveja','garbanzo','poroto','sardina'] },
  { name: 'Bebidas',               emoji: '🧃', keys: ['jugo','agua','gaseosa','cerveza','vino','soda'] },
  { name: 'Fiambres',              emoji: '🥩', keys: ['salchicha','jamon','mortadela','chorizo','salame','panceta','fiambre','pate','lomito','bondiola'] },
  { name: 'Snacks y Proteínas',    emoji: '💪', keys: ['barra proteica','barra protei','integra'] },
];

function categorize(name) {
  const n = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  for (const cat of CATS) {
    if (cat.keys.some(k => n.includes(k))) return cat;
  }
  return { name: 'Otros', emoji: '📦' };
}

// ── CONSTANTS ──────────────────────────────────────────────────
const SUPERS    = ['DIA','CARREFOUR','JUMBO','DISCO','COTO','NINI'];
const SUPER_CSS = { DIA:'dia', CARREFOUR:'carrefour', JUMBO:'jumbo', DISCO:'disco', COTO:'coto', NINI:'nini' };

let globalData = null;
let currentCat = 'all';
let onlyPromo  = false;

// ── HELPERS ────────────────────────────────────────────────────
function norm(s) {
  return (s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function fmtPrice(n) {
  return '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extractSize(name) {
  const m = norm(name).match(/(\d+(?:[.,]\d+)?)\s*(g\b|gr\b|grm\b|grs\b|kg\b|ml\b|cc\b|lt\b|ltr\b)/);
  if (!m) return null;
  let val = parseFloat(m[1].replace(',', '.'));
  if (['kg','lt','ltr'].includes(m[2])) val *= 1000;
  return val;
}

function dominantSize(items) {
  const sizes = items.map(i => extractSize(i.nombre)).filter(Boolean);
  if (sizes.length === 0) return null;
  const freq = {};
  for (const s of sizes) freq[s] = (freq[s] ?? 0) + 1;
  return Number(Object.entries(freq).sort((a,b) => b[1]-a[1])[0][0]);
}

// ── COMPARABLES ────────────────────────────────────────────────
// Para cada tienda devuelve el ítem que se puede comparar de verdad:
//  - match 'ean' / 'aprox': solo el ítem alineado (mismo envase); si la tienda
//    no lo tiene, no se compara nada (se muestra el candidato apagado).
//  - match 'ninguno': el primer resultado de cada tienda (comparación libre).
//  - NINI: precios manuales, siempre se muestran.
function matchDe(precios) {
  return precios._match ?? { tipo: 'ninguno', porTienda: {}, cobertura: 0, faltantes: [] };
}
function filaTienda(precios, s) {
  const m     = matchDe(precios);
  const lista = precios[s] ?? [];
  const top   = lista[0] ?? null;
  if (s === 'NINI')        return { item: top, tag: top ? 'manual' : null, distinto: null };
  if (m.tipo === 'ninguno') return { item: top, tag: top ? 'libre' : null, distinto: null };
  const tag = m.porTienda?.[s] ?? null;
  return tag ? { item: top, tag, distinto: null } : { item: null, tag: null, distinto: top };
}
function comparables(precios) {
  const out = {};
  for (const s of SUPERS) out[s] = filaTienda(precios, s).item;
  return out;
}
function promosAbiertas(item) {
  return (item?.promos ?? []).filter(p => p.tipo !== 'medio_pago' && p.tipo !== 'campania');
}
function tienePromo(precios) {
  return Object.values(comparables(precios)).some(i => i && promosAbiertas(i).length > 0);
}
function precioConPromo(item) {
  return item.precioEfectivo != null && item.precioEfectivo < item.precio ? item.precioEfectivo : item.precio;
}
function promoChips(item) {
  const promos = item.promos ?? [];
  const abiertas = promos.filter(p => p.tipo !== 'medio_pago' && p.tipo !== 'campania');
  const camp     = promos.filter(p => p.tipo === 'campania');
  const pago     = promos.filter(p => p.tipo === 'medio_pago');
  let html = abiertas.map(p => `<span class="promo-chip" title="${esc(p.etiqueta)}">${esc(p.etiqueta)}</span>`).join('');
  html += camp.slice(0, 1).map(p => `<span class="promo-chip camp" title="${esc(camp.map(c => c.etiqueta).join(' · '))}">${esc(p.etiqueta)}</span>`).join('');
  if (pago.length) {
    // Descuentos por tarjeta / cuenta / membresía: no aplican a todos, se muestran compactos
    html += `<span class="promo-chip pay" title="${esc(pago.map(p => p.etiqueta).join(' · '))}"><span class="material-icons-round">credit_card</span>${pago.length > 1 ? pago.length : ''}</span>`;
  }
  return html;
}

// ── RENDER CARD ────────────────────────────────────────────────
// Una fila por supermercado: sin grupos duplicados, máximo 6 filas.
function renderCard(producto, precios) {
  const m    = matchDe(precios);
  const rows = SUPERS.map(s => ({ s, ...filaTienda(precios, s), extraCount: Math.max(0, (precios[s] ?? []).length - 1) }));
  const withPrice = rows.filter(r => r.item !== null);

  if (withPrice.length === 0) {
    const sugeridos = rows.filter(r => r.distinto).length;
    return `<div class="product-card">
      <div class="card-header">
        <span class="card-product-name">${esc(producto)}</span>
        <span class="badge badge-orange">
          <span class="material-icons-round">search_off</span> Sin resultados
        </span>
      </div>
      <div class="no-results-msg">
        <span class="material-icons-round">info_outline</span>
        ${sugeridos ? 'Hay resultados parecidos pero ninguno es el mismo envase' : 'No encontrado en ningún supermercado'}
      </div>
    </div>`;
  }

  const libre      = m.tipo === 'ninguno';
  const refSize    = libre ? dominantSize(withPrice.map(r => r.item)) : null;
  const sizesVary  = libre && refSize != null && withPrice.some(r => {
    const sz = extractSize(r.item.nombre);
    return sz && (sz / refSize > 1.3 || sz / refSize < 0.77);
  });
  const comparePrice = (item) => {
    if (!sizesVary) return item.precio;
    const sz = extractSize(item.nombre);
    return sz ? (item.precio / sz * 100) : item.precio;
  };

  const globalMin      = Math.min(...withPrice.map(r => comparePrice(r.item)));
  const globalMinSuper = withPrice.find(r => comparePrice(r.item) === globalMin)?.s ?? '';

  // Mejor precio aprovechando promos (2x1, 2do al X%, etc.)
  const promoMin      = Math.min(...withPrice.map(r => precioConPromo(r.item)));
  const promoMinRow   = withPrice.find(r => precioConPromo(r.item) === promoMin);
  const promoCambia   = !sizesVary && promoMinRow && promoMin < globalMin && promosAbiertas(promoMinRow.item).length > 0;

  const nSupers = SUPERS.filter(s => s !== 'NINI').length;
  const matchBadge = m.tipo === 'ean'
    ? `<span class="badge badge-green" title="Mismo código de barras (EAN ${esc(m.ean ?? '')}) en ${m.cobertura} tiendas"><span class="material-icons-round">verified</span> Mismo producto · ${m.cobertura}/${nSupers}</span>`
    : m.tipo === 'aprox'
    ? `<span class="badge badge-amber" title="Misma marca, mismo contenido y misma variante, sin código de barras común"><span class="material-icons-round">join_inner</span> Aproximado · ${m.cobertura}/${nSupers}</span>`
    : `<span class="badge badge-gray" title="No se encontró el mismo envase en dos tiendas: se compara lo más parecido de cada una"><span class="material-icons-round">compare_arrows</span> Comparación libre</span>`;

  const priceBadge = `<span class="badge badge-green">
    <span class="material-icons-round">check_circle</span>
    ${sizesVary
      ? `${fmtPrice(Math.round(globalMin))}/100g · ${globalMinSuper}`
      : `${fmtPrice(globalMin)} · ${globalMinSuper}`}
  </span>`;
  const promoBadge = promoCambia
    ? `<span class="badge badge-promo" title="${esc(promosAbiertas(promoMinRow.item)[0].etiqueta)}"><span class="material-icons-round">local_offer</span> Con promo ${fmtPrice(Math.round(promoMin))} · ${promoMinRow.s}</span>`
    : '';

  const rowsHtml = rows.map(({ s, item, tag, distinto, extraCount }) => {
    if (!item && distinto) {
      return `<div class="price-row distinto" title="Encontrado, pero no es el mismo envase / variante. No se compara.">
        <span class="pr-super ${SUPER_CSS[s]}">${s}</span>
        <span class="pr-price">${fmtPrice(distinto.precio)}</span>
        <span class="pr-name">
          <span class="pr-tag libre">≠ envase</span>
          <span class="pr-name-text">${esc(distinto.nombre ?? '')}</span>
        </span>
      </div>`;
    }
    if (!item) {
      return `<div class="price-row unavailable">
        <span class="pr-super ${SUPER_CSS[s]}">${s}</span>
        <span class="pr-unavailable">—</span>
      </div>`;
    }

    const isCheapest = comparePrice(item) === globalMin;
    const extras = extraCount > 0
      ? ` <span style="color:var(--text-dim);font-size:10px;font-style:italic">+${extraCount}</span>`
      : '';

    const itemSize     = libre ? extractSize(item.nombre) : null;
    const sizeMismatch = libre && refSize && itemSize && (itemSize / refSize > 1.3 || itemSize / refSize < 0.77);
    const sizeLabel    = sizeMismatch ? (itemSize >= 1000 ? (itemSize/1000)+'kg' : itemSize+'g') : null;
    const per100       = sizesVary && itemSize ? `${fmtPrice(Math.round(item.precio / itemSize * 100))}/100g` : null;
    const eff          = precioConPromo(item) < item.precio ? `<span class="pr-eff" title="Precio por unidad aprovechando la promo">≈ ${fmtPrice(Math.round(precioConPromo(item)))} c/u</span>` : '';
    const tagHtml      = tag === 'aprox' ? `<span class="pr-tag aprox" title="Misma marca, contenido y variante; sin código de barras común">~ aprox</span>` : '';

    return `<div class="price-row ${isCheapest ? 'cheapest' : ''}">
      <span class="pr-super ${SUPER_CSS[s]}">${s}</span>
      <span class="pr-price">
        ${fmtPrice(item.precio)}
        ${isCheapest ? '<span class="material-icons-round">check</span>' : ''}
      </span>
      <span class="pr-name">
        ${tagHtml}
        <span class="pr-name-text" title="${esc(item.nombre ?? '')}">${esc(item.nombre ?? '')}${extras}</span>
        ${sizeLabel ? `<span class="pr-size-warn">⚠ ${sizeLabel}</span>` : ''}
        ${per100 ? `<span class="pr-per100">${per100}</span>` : ''}
        ${promoChips(item)}
        ${eff}
      </span>
    </div>`;
  }).join('');

  return `<div class="product-card">
    <div class="card-header">
      <span class="card-product-name">${esc(producto)}</span>
      <div class="card-badges">${matchBadge}${priceBadge}${promoBadge}</div>
    </div>
    ${rowsHtml}
  </div>`;
}

// ── RENDER VIEW ────────────────────────────────────────────────
function renderView(data, catFilter, searchStr, sortMode) {
  const search       = norm(searchStr.trim());
  const originalOrder = Object.keys(data);

  const grouped = {};
  for (const prod of originalOrder) {
    if (search && !norm(prod).includes(search)) continue;
    if (onlyPromo && !tienePromo(data[prod])) continue;
    const cat = categorize(prod);
    if (!grouped[cat.name]) grouped[cat.name] = { emoji: cat.emoji, items: [] };
    grouped[cat.name].items.push(prod);
  }

  const catOrder = [...CATS.map(c => c.name), 'Otros'];
  let sections = Object.entries(grouped)
    .sort(([a], [b]) => catOrder.indexOf(a) - catOrder.indexOf(b));

  if (catFilter !== 'all') sections = sections.filter(([name]) => name === catFilter);

  if (sections.length === 0) {
    return `<div class="center-msg">
      <span class="material-icons-round" style="font-size:48px;color:var(--text-dim)">search_off</span>
      <div>No se encontraron productos</div>
    </div>`;
  }

  return sections.map(([catName, cfg]) => {
    let items = [...cfg.items];
    if (sortMode === 'alpha') {
      items.sort();
    } else if (sortMode === 'cheapest') {
      const minDe = (p) => Math.min(...Object.values(comparables(data[p])).map(i => i?.precio ?? Infinity));
      items.sort((a, b) => minDe(a) - minDe(b));
    } else if (sortMode === 'promo') {
      // Primero los que tienen promo, ordenados por cuánto ahorra la promo
      const ahorro = (p) => Math.max(0, ...Object.values(comparables(data[p])).filter(Boolean).map(i => i.precio - precioConPromo(i)));
      items.sort((a, b) => ahorro(b) - ahorro(a));
    } else {
      items.sort((a, b) => originalOrder.indexOf(a) - originalOrder.indexOf(b));
    }

    const cardsHtml = items.map(p => renderCard(p, data[p])).join('');
    return `<section class="cat-section">
      <div class="cat-title">
        <span class="emoji">${cfg.emoji}</span>
        <h2>${catName}</h2>
        <span class="cat-badge">${items.length} productos</span>
      </div>
      <div class="product-grid">${cardsHtml}</div>
    </section>`;
  }).join('');
}

// ── TABS ───────────────────────────────────────────────────────
function buildTabs(data) {
  const counts = {};
  for (const prod of Object.keys(data)) {
    const cat = categorize(prod).name;
    counts[cat] = (counts[cat] ?? 0) + 1;
  }
  const catOrder = [...CATS.map(c => c.name), 'Otros'];
  const sorted = Object.entries(counts).sort(([a], [b]) => catOrder.indexOf(a) - catOrder.indexOf(b));

  let html = `<button class="cat-tab active" onclick="filterCat('all',this)">🛒 Todos</button>`;
  for (const [catName, count] of sorted) {
    const emoji = CATS.find(c => c.name === catName)?.emoji ?? '📦';
    html += `<button class="cat-tab" onclick="filterCat('${catName.replace(/'/g,"\\'")}',this)">
      ${emoji} ${catName} <span style="opacity:.4;font-weight:400">${count}</span>
    </button>`;
  }
  document.getElementById('cat-tabs').innerHTML = html;
}

// ── STATS ──────────────────────────────────────────────────────
function computeStats(data) {
  const products = Object.keys(data).length;
  let exactos = 0, conPromo = 0;
  const wins = {};
  SUPERS.forEach(s => wins[s] = 0);

  for (const precios of Object.values(data)) {
    if (matchDe(precios).tipo === 'ean') exactos++;
    if (tienePromo(precios)) conPromo++;
    const comp = comparables(precios);
    const tops = SUPERS.map(s => comp[s]?.precio ?? null).filter(v => v !== null);
    if (tops.length > 0) {
      const min = Math.min(...tops);
      SUPERS.forEach(s => { if (comp[s]?.precio === min) wins[s]++; });
    }
  }

  const cheapestSuper = SUPERS.reduce((a, b) => wins[a] >= wins[b] ? a : b);
  return { products, exactos, cheapestSuper, conPromo };
}

// ── BEST BUYS ──────────────────────────────────────────────────
function computeBestBuysBySuper(data) {
  const result = {};
  SUPERS.forEach(s => result[s] = []);

  for (const [prod, precios] of Object.entries(data)) {
    const comp = comparables(precios);
    let globalMin = Infinity, globalMinSuper = '', promo = null;
    for (const s of SUPERS) {
      const item = comp[s];
      if (!item) continue;
      const price = precioConPromo(item);
      if (price > 0 && price < globalMin) {
        globalMin = price;
        globalMinSuper = s;
        promo = promosAbiertas(item)[0]?.etiqueta ?? null;
      }
    }
    if (globalMinSuper) result[globalMinSuper].push({ product: prod, precio: globalMin, promo });
  }
  return result;
}

let bestBuysExpanded = false;

function renderBestBuys(data) {
  const bySuper = computeBestBuysBySuper(data);
  const total   = Object.values(bySuper).reduce((acc, arr) => acc + arr.length, 0);
  document.getElementById('best-buys-count').textContent = total + ' productos asignados';

  const colsHtml = SUPERS.map(s => {
    const css   = SUPER_CSS[s];
    const color = `var(--${css})`;
    const items = bySuper[s].slice().sort((a, b) => a.precio - b.precio);
    const itemsHtml = items.length === 0
      ? `<div style="font-size:11px;color:var(--text-dim);padding:3px 0">\u2014</div>`
      : items.map(i => `<div class="best-buys-item">
          <span class="best-buys-item-name">${esc(i.product)}${i.promo ? `<span class="best-buys-item-promo" title="${esc(i.promo)}">${esc(i.promo)}</span>` : ''}</span>
          <span class="best-buys-item-price">${esc(fmtPrice(Math.round(i.precio)))}</span>
        </div>`).join('');
    return `<div class="best-buys-col">
      <div class="best-buys-col-title" style="color:${color}">
        <div class="dot" style="background:${color}"></div>
        ${esc(s)} <span style="color:var(--text-dim);font-weight:400;margin-left:2px">${items.length}</span>
      </div>
      ${itemsHtml}
    </div>`;
  }).join('');

  document.getElementById('best-buys-grid').innerHTML = colsHtml;
}

function toggleBestBuys() {
  bestBuysExpanded = !bestBuysExpanded;
  document.getElementById('best-buys-panel').style.display = bestBuysExpanded ? '' : 'none';
  document.getElementById('best-buys-icon').textContent = bestBuysExpanded ? 'expand_less' : 'expand_more';
}

// ── FILTERS ────────────────────────────────────────────────────
function applyFilters() {
  if (!globalData) return;
  const search = document.getElementById('search-input').value;
  const sort   = document.getElementById('sort-select').value;
  document.getElementById('main-content').innerHTML = renderView(globalData, currentCat, search, sort);
}

function togglePromo() {
  onlyPromo = !onlyPromo;
  document.getElementById('promo-toggle').classList.toggle('active', onlyPromo);
  applyFilters();
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

// ── LOAD DATA ──────────────────────────────────────────────────
async function loadData() {
  document.getElementById('main-content').innerHTML = `
    <div class="center-msg"><div class="spinner"></div><div>Buscando precios en tiempo real…</div></div>`;

  try {
    const res  = await fetch('/api/scrape');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    globalData = data;

    const stats = computeStats(data);
    document.getElementById('stat-products').textContent       = stats.products;
    document.getElementById('stat-found').textContent          = stats.exactos;
    document.getElementById('stat-cheapest-super').textContent = stats.cheapestSuper;
    document.getElementById('stat-groups').textContent         = stats.conPromo;

    document.getElementById('meta-date').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });

    buildTabs(data);
    renderBestBuys(data);
    currentCat = 'all';
    document.getElementById('main-content').innerHTML = renderView(data, 'all', '', 'default');

  } catch (err) {
    document.getElementById('main-content').innerHTML = `
      <div class="center-msg">
        <span class="material-icons-round" style="font-size:48px;color:var(--dia)">error_outline</span>
        <div style="font-weight:500">Error al cargar precios.json</div>
        <div style="font-size:13px;color:var(--text-sub)">${err.message}</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:8px">
          La búsqueda puede tardar hasta 30s. Reintentá en unos momentos.
        </div>
      </div>`;
  }
}

loadData();
</script>
